# ----------------------------------------------------------------------------
# Configuración del balanceador NGINX
#
# Funcionalidad:
#   - Proxy inverso hacia las dos aplicaciones Flask.
#   - Política de balanceo: round robin (es la política por defecto de NGINX
#     cuando se define un upstream sin especificar otro algoritmo).
#   - Terminación SSL: el tráfico llega cifrado a NGINX, internamente viaja
#     en HTTP entre contenedores (red privada de Docker).
#   - Redirección 80 -> 443 para forzar HTTPS.
# ----------------------------------------------------------------------------

# ---- Definición del grupo de servidores (upstream) -------------------------
# NGINX repartirá las peticiones entre estas dos apps por round robin.
# Los hostnames `app-web-ingles` y `app-web-espanol` son resueltos por
# el DNS interno de Docker a las IPs de cada contenedor.
upstream grupo-apps-web {
    # Política de round robin (es la default, se deja comentada para dejarla explícita)
    # round robin: cada petición va al siguiente servidor en orden
    server app-web-ingles:5000;
    server app-web-espanol:5000;

    # Mantener conexiones vivas hacia los upstreams para mejor performance
    keepalive 32;
}

# ---- Servidor HTTP: redirige todo a HTTPS -----------------------------------
server {
    listen 80;
    server_name _;

    # Cualquier petición HTTP se redirige permanentemente a HTTPS
    return 301 https://$host$request_uri;
}

# ---- Servidor HTTPS: la entrada real al sistema ----------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificado SSL (autofirmado para esta práctica, ver generar-certificado.sh)
    ssl_certificate     /etc/nginx/certs/certificado-sitio.crt;
    ssl_certificate_key /etc/nginx/certs/clave-privada.key;

    # Parámetros SSL razonables: solo TLS moderno
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de seguridad básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Tamaño máximo del cuerpo de la petición (registros son pequeños)
    client_max_body_size 1m;

    # ---- Proxy hacia las apps Flask --------------------------------------
    location / {
        proxy_pass http://grupo-apps-web;

        # Headers para que la app sepa que viene a través de un proxy HTTPS
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts razonables
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Necesario para keepalive con upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---- Endpoint para verificar que el balanceador está vivo -----------
    location = /salud {
        access_log off;
        return 200 "balanceador-ok\n";
        add_header Content-Type text/plain;
    }
}
